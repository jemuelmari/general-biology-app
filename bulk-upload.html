<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Students to Google Sheets</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #e8f5e9; padding: 40px 20px; text-align: center; }
    .card { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    h1 { color: #1b7a3d; margin-bottom: 10px; }
    p { color: #555; margin-bottom: 25px; line-height: 1.5; }
    button { background: #1b7a3d; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.3s; }
    button:hover { background: #145c2e; }
    button:disabled { background: #a5d6a7; cursor: not-allowed; }
    #status-box { margin-top: 20px; text-align: left; font-size: 14px; background: #f5f5f5; padding: 15px; border-radius: 8px; max-height: 300px; overflow-y: auto; display: none; }
    .success { color: green; font-weight: bold; }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h1>📤 I-upload ang mga Bata sa Google Sheets</h1>
    <p>Ito po ay gagamitin para kopyahin ang lahat ng "Saved Users" mula sa laptop ninyo papunta sa inyong <b>StudentsMasterlist</b> sa Google Sheets.</p>
    
    <button id="upload-btn" onclick="startUpload()">Simulan ang Pag-upload</button>
    
    <div id="status-box"></div>
  </div>

  <script>
    // Ito ang URL ng backend mo (galing sa config.js mo)
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyi2fj-Jnmlk7Pp4qhtfuE_lz0zSewtLfRPiAZnPO5A-uA5ICvicE_DPUry_lax69ubuQ/exec';

    async function startUpload() {
      const btn = document.getElementById('upload-btn');
      const box = document.getElementById('status-box');
      
      btn.disabled = true;
      btn.textContent = '⏳ Nag-a-upload... Mangyaring maghintay...';
      box.style.display = 'block';
      box.innerHTML = 'Sinisimulan...<br>';

      // Kunin lahat ng bata na naka-save sa laptop (galing sa localStorage ng app)
      const NS = 'gba_v1_';
      const users = JSON.parse(localStorage.getItem(`${NS}users`) || '[]');
      
      if (users.length === 0) {
        box.innerHTML += '<span class="error">Walang nahanap na students sa laptop na ito.</span>';
        btn.disabled = false;
        btn.textContent = 'Simulan ang Pag-upload';
        return;
      }

      let successCount = 0;

      for (const user of users) {
        box.innerHTML += `⏳ Hinahatid si: ${user.lastName}, ${user.firstName}...<br>`;
        box.scrollTop = box.scrollHeight;

        // Kunin ang progress at scores niya sa laptop
        const progress = JSON.parse(localStorage.getItem(`${NS}progress_${user.lrn}`) || '{}');
        const scores = JSON.parse(localStorage.getItem(`${NS}scores_${user.lrn}`) || '{}');
        const badges = JSON.parse(localStorage.getItem(`${NS}badges_${user.lrn}`) || '{}');

        try {
          // Ipadala sa Google Sheets (Backend)
          const res = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'upsertStudentMaster',
              lrn: user.lrn,
              student: {
                lastName: user.lastName,
                firstName: user.firstName,
                middleName: user.middleName || '',
                gradeLevel: user.gradeLevel,
                section: user.section,
                sex: user.sex || ''
              },
              progress: progress,
              scores: scores,
              badges: badges,
              deviceId: 'BULK-UPLOAD-BROWSER'
            })
          });
          
          const data = await res.json();
          
          if (data.ok) {
            box.innerHTML += `<span class="success">✅ Success!</span><br><br>`;
            successCount++;
          } else {
            box.innerHTML += `<span class="error">❌ Failed: ${data.error}</span><br><br>`;
          }
        } catch (err) {
          box.innerHTML += `<span class="error">❌ Error: ${err.message}</span><br><br>`;
        }
        
        box.scrollTop = box.scrollHeight;

        // Maghintay ng 1 segundo para hindi mag-error ang Google
        await new Promise(r => setTimeout(r, 1000));
      }

      box.innerHTML += `<hr><b>🎉 TAPOS! ${successCount} out of ${users.length} ang na-upload.</b><br>`;
      box.innerHTML += `Pumunta na po kayo sa inyong Google Sheets at i-refresh para makita ang "StudentsMasterlist".`;
      box.scrollTop = box.scrollHeight;
      
      btn.textContent = 'Tapos na!';
    }
  </script>
</body>
</html>
