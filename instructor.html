<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Application — General Biology</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/teacher.css" />
</head>
<body>

  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div>
        <h1>👩‍🏫 Teacher Application</h1>
        <span class="version">v1.0.0</span>
      </div>
      <nav style="display:flex;gap:8px;">
        <a href="index.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">Student View</a>
        <a href="classrecord.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">Class Record</a>
        <button onclick="TeacherAuth.logout()" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;">

    <h2 style="color:var(--color-primary-dark);margin-bottom:16px;">📊 Dashboard Overview</h2>
    <div class="stats-grid" id="teacher-stats"></div>

    <h2 style="color:var(--color-primary-dark);margin:24px 0 12px;">🎯 Quick Actions</h2>
    <div class="dashboard-grid" id="teacher-actions"></div>

    <h2 style="color:var(--color-primary-dark);margin:24px 0 12px;">🚨 Needs Immediate Attention</h2>
    <div id="urgent-list"></div>

    <h2 style="color:var(--color-primary-dark);margin:24px 0 12px;">📥 Recent Submissions</h2>
    <div id="recent-subs"></div>

  </main>

  <footer class="app-footer">
    <p>Teacher Application · v1.0.0 · Aligned with DO 015, s. 2026</p>
  </footer>

  <script src="config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/security.js"></script>
  <script src="assets/js/transmutation.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/teacher.js"></script>
  <script src="assets/js/teacher-auth.js"></script>
</body>
</html>
