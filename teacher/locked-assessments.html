<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locked Assessments — Teacher</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/teacher.css" />
</head>
<body>

  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div>
        <h1>🔒 Locked Assessments</h1>
        <span class="version">v2.3.7</span>
      </div>
      <nav class="teacher-nav">
        <a href="../instructor.html">← Teacher Home</a>
        <button onclick="TeacherAuth.logout()">🚪 Log Out</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;">

    <!-- ============ HERO ============ -->
    <div class="teacher-hero" style="background:linear-gradient(135deg, #7f0000 0%, #b71c1c 50%, #e53935 100%);">
      <div class="teacher-hero-content">
        <div class="teacher-hero-text">
          <h1>🔒 Manage Locked Assessments</h1>
          <p>Students who submitted cannot retake unless you unlock them here.</p>
          <div class="teacher-hero-meta" id="hero-meta"></div>
        </div>
        <div class="teacher-hero-actions">
          <a href="#" onclick="unlockAll(); return false;">🔓 Unlock All</a>
        </div>
      </div>
    </div>

    <!-- ============ FILTER BAR ============ -->
    <div class="card" style="padding:20px;margin-bottom:24px;">
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:end;">
        <div style="flex:1;min-width:200px;">
          <label class="form-label" style="font-size:0.75rem;text-transform:uppercase;font-weight:700;color:#5f6368;">Subject</label>
          <select id="la-subject" class="form-control">
            <option value="">All Subjects</option>
            <option value="biol1">General Biology 1</option>
            <option value="biol2">General Biology 2</option>
          </select>
        </div>
        <div style="flex:1;min-width:200px;">
          <label class="form-label" style="font-size:0.75rem;text-transform:uppercase;font-weight:700;color:#5f6368;">Search Student</label>
          <input type="text" id="la-search" class="form-control" placeholder="Type a name or LRN..." />
        </div>
        <div>
          <button id="btn-clear" class="btn btn-outline" style="font-size:0.85rem;">↺ Clear</button>
        </div>
      </div>
    </div>

    <!-- ============ STAT CARDS ============ -->
    <div class="stats-grid" id="la-stats"></div>

    <!-- ============ LIST ============ -->
    <div id="la-list"></div>

  </main>

  <footer class="app-footer">
    <p>Locked Assessments · <span class="version">v2.3.7</span></p>
  </footer>

  <script src="../config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui-helpers.js"></script>
  <script src="../assets/js/teacher-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const subjectSel = document.getElementById('la-subject');
      const searchInput = document.getElementById('la-search');
      const btnClear = document.getElementById('btn-clear');

      subjectSel.addEventListener('change', render);
      searchInput.addEventListener('input', render);
      btnClear.addEventListener('click', () => {
        subjectSel.value = '';
        searchInput.value = '';
        render();
      });

      render();

      function collectLocks() {
        const users = APP.sortStudents(Store.getAllUsers(), 'last', 'asc');
        const locks = [];

        users.forEach((u) => {
          const prefix = `gba_v1_lock_${u.lrn}_`;
          Object.keys(localStorage).forEach((key) => {
            if (key.startsWith(prefix)) {
              try {
                const data = JSON.parse(localStorage.getItem(key));
                const assessmentId = key.replace(prefix, '');
                const subject = assessmentId.startsWith('biol1') ? 'biol1' : 'biol2';
                locks.push({ user: u, subject, assessmentId, locked: data, key });
              } catch (e) { /* ignore */ }
            }
          });
        });

        return locks;
      }

      function render() {
        let locks = collectLocks();

        const subject = subjectSel.value;
        if (subject) locks = locks.filter((l) => l.subject === subject);

        const query = searchInput.value.toLowerCase().trim();
        if (query) {
          locks = locks.filter((l) =>
            `${l.user.lastName} ${l.user.firstName} ${l.user.lrn}`.toLowerCase().includes(query)
          );
        }

        renderHeroMeta(locks);
        renderStats(locks);
        renderList(locks);
      }

      /* ---------- Hero Meta ---------- */
      function renderHeroMeta(locks) {
        const el = document.getElementById('hero-meta');
        if (!el) return;

        const passing = locks.filter((l) => l.locked.percent >= 80).length;
        const below80 = locks.length - passing;

        el.innerHTML = `
          <div class="teacher-hero-stat">🔒 <strong>${locks.length}</strong> Total Locked</div>
          <div class="teacher-hero-stat">✅ <strong>${passing}</strong> Passing</div>
          <div class="teacher-hero-stat">⚠️ <strong>${below80}</strong> Below 80%</div>
        `;
      }

      /* ---------- Stats ---------- */
      function renderStats(locks) {
        const biol1Count = locks.filter((l) => l.subject === 'biol1').length;
        const biol2Count = locks.filter((l) => l.subject === 'biol2').length;
        const passing = locks.filter((l) => l.locked.percent >= 80).length;
        const below80 = locks.length - passing;

        document.getElementById('la-stats').innerHTML = `
          <div class="stat-card red">
            <div class="stat-icon">🔒</div>
            <div class="stat-value">${locks.length}</div>
            <div class="stat-label">Total Locked</div>
          </div>
          <div class="stat-card blue">
            <div class="stat-icon">🔬</div>
            <div class="stat-value">${biol1Count}</div>
            <div class="stat-label">Bio 1 Locked</div>
          </div>
          <div class="stat-card purple">
            <div class="stat-icon">🌱</div>
            <div class="stat-value">${biol2Count}</div>
            <div class="stat-label">Bio 2 Locked</div>
          </div>
          <div class="stat-card green">
            <div class="stat-icon">✅</div>
            <div class="stat-value">${passing}</div>
            <div class="stat-label">Passing (≥ 80%)</div>
          </div>
          <div class="stat-card amber">
            <div class="stat-icon">⚠️</div>
            <div class="stat-value">${below80}</div>
            <div class="stat-label">Below 80%</div>
          </div>
        `;
      }

      /* ---------- List ---------- */
      function renderList(locks) {
        const list = document.getElementById('la-list');

        if (!locks.length) {
          list.innerHTML = `
            <div style="background:#fff;border-radius:14px;padding:48px 24px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.04);">
              <div style="font-size:3.5rem;">🎉</div>
              <h3 style="margin:12px 0 6px;color:#2e7d32;">All Clear!</h3>
              <p style="color:#5f6368;font-size:0.95rem;margin:0;">
                No locked assessments match your filters.<br>
                All students can retake any assessment freely.
              </p>
            </div>
          `;
          return;
        }

        list.innerHTML = locks.map((l) => {
          const avatar = UI.renderAvatar(l.user.firstName, l.user.lastName, l.user.lrn);
          const percent = l.locked.percent || 0;
          const color = percent >= 90 ? '#2e7d32'
                       : percent >= 80 ? '#0277bd'
                       : percent >= 65 ? '#ed6c02'
                       : '#c62828';
          const status = percent >= 80
            ? '<span class="badge-pill success" style="font-size:0.68rem;">✓ PASSING</span>'
            : '<span class="badge-pill warning" style="font-size:0.68rem;">⚠ BELOW 80%</span>';
          const assessmentLabel = formatAssessmentId(l.assessmentId);
          const subjectEmoji = l.subject === 'biol1' ? '🔬' : '🌱';

          return `
            <div style="background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.05);border-left:4px solid ${color};margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
              ${avatar}
              <div style="flex:1;min-width:220px;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
                  <span style="font-weight:700;font-size:0.95rem;color:#1a1a1a;">
                    ${APP.formatFullName(l.user.lastName, l.user.firstName, l.user.middleName)}
                  </span>
                  ${APP.getSexBadge(l.user.sex)}
                  ${status}
                </div>
                <div style="font-size:0.78rem;color:#78909c;margin-bottom:8px;">
                  LRN: ${APP.formatLRN(l.user.lrn)} · ${l.user.section}
                </div>
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:0.88rem;">
                  <span style="font-weight:600;color:#37474f;">
                    ${subjectEmoji} ${assessmentLabel}
                  </span>
                  <span style="color:${color};font-weight:800;font-size:1rem;">
                    ${l.locked.score}/${l.locked.total}
                  </span>
                  <span style="color:${color};font-weight:700;">
                    (${percent}%)
                  </span>
                  ${l.locked.lockedAt ? `<span style="color:#b0bec5;font-size:0.75rem;">· ${UI.fmtDateRelative(l.locked.lockedAt)}</span>` : ''}
                </div>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-primary" style="font-size:0.82rem;padding:9px 16px;font-weight:600;" onclick="unlockOne('${l.user.lrn}', '${l.assessmentId}')">
                  🔓 Unlock
                </button>
                <button class="btn btn-outline" style="font-size:0.82rem;padding:9px 14px;" onclick="viewDetails('${l.user.lrn}', '${l.assessmentId}')">
                  👁️ Details
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      /* ---------- Helpers ---------- */
      function formatAssessmentId(id) {
        const map = {
          'biol1-quiz1': 'Bio 1 · Quiz 1',
          'biol1-quiz2': 'Bio 1 · Quiz 2',
          'biol1-quiz3': 'Bio 1 · Quiz 3',
          'biol1-st1': 'Bio 1 · Summative Test 1',
          'biol1-st2': 'Bio 1 · Summative Test 2',
          'biol1-te': 'Bio 1 · Term Exam',
          'biol2-quiz1': 'Bio 2 · Quiz 1',
          'biol2-quiz2': 'Bio 2 · Quiz 2',
          'biol2-quiz3': 'Bio 2 · Quiz 3',
          'biol2-st1': 'Bio 2 · Summative Test 1',
          'biol2-st2': 'Bio 2 · Summative Test 2',
          'biol2-te': 'Bio 2 · Term Exam'
        };
        return map[id] || id;
      }

      window.unlockOne = function (lrn, assessmentId) {
        const user = Store.getUser(lrn);
        const name = user ? APP.formatFullName(user.lastName, user.firstName, user.middleName) : lrn;
        const label = formatAssessmentId(assessmentId);
        if (!confirm(`Unlock "${label}" for ${name}?\n\nThe student will be able to retake this assessment from scratch.`)) return;
        Store.unlockAssessment(lrn, assessmentId);
        APP.toast('🔓 Assessment unlocked', 'success');
        render();
      };

      window.unlockAll = function () {
        const locks = collectLocks();
        if (!locks.length) {
          APP.toast('No locked assessments to unlock.', 'info');
          return;
        }
        if (!confirm(`Unlock ALL ${locks.length} locked assessments?\n\nAll students will be able to retake their assessments.`)) return;
        locks.forEach((l) => Store.unlockAssessment(l.user.lrn, l.assessmentId));
        APP.toast(`🔓 ${locks.length} assessments unlocked`, 'success');
        render();
      };

      window.viewDetails = function (lrn, assessmentId) {
        const key = `gba_v1_lock_${lrn}_${assessmentId}`;
        const data = JSON.parse(localStorage.getItem(key) || '{}');
        const user = Store.getUser(lrn);
        const name = user ? APP.formatFullName(user.lastName, user.firstName, user.middleName) : lrn;

        alert(`Assessment Details\n\nStudent: ${name}\nAssessment: ${formatAssessmentId(assessmentId)}\nScore: ${data.score}/${data.total} (${data.percent}%)\nLocked at: ${data.lockedAt ? APP.formatDate(data.lockedAt) : 'Unknown'}`);
      };
    });
  </script>
</body>
</html>
