<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locked Assessments — Teacher</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/teacher.css" />
</head>
<body>

  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div>
        <h1>🔒 Locked Assessments</h1>
        <span class="version">v2.5.0</span>
      </div>
      <nav class="teacher-nav">
        <a href="../instructor.html">← Teacher Home</a>
        <button onclick="TeacherAuth.logout()">🚪 Log Out</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;">

    <div class="teacher-hero" style="background:linear-gradient(135deg, #7f0000 0%, #b71c1c 50%, #e53935 100%);">
      <div class="teacher-hero-content">
        <div class="teacher-hero-text">
          <h1>🔒 Manage Locked Assessments (Backend)</h1>
          <p>This page pulls all locks from the backend. Unlocks are pushed back to the student's device.</p>
          <div class="teacher-hero-meta" id="hero-meta"></div>
        </div>
        <div class="teacher-hero-actions">
          <a href="#" onclick="fetchAndRenderLocks(); return false;">☁️ Refresh Locks</a>
        </div>
      </div>
    </div>

    <div class="card" style="padding:20px;margin-bottom:24px;">
      <label class="form-label" style="font-size:0.75rem;text-transform:uppercase;font-weight:700;color:#5f6368;">Teacher Token</label>
      <input type="password" id="teacher-token" class="form-control" placeholder="Enter teacher password" style="max-width:320px;" />

      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin-top:16px;">
        <div style="flex:1;min-width:200px;">
          <label class="form-label" style="font-size:0.75rem;text-transform:uppercase;font-weight:700;color:#5f6368;">Search Student</label>
          <input type="text" id="la-search" class="form-control" placeholder="Type a name or LRN..." />
        </div>
        <div>
          <button id="btn-fetch" class="btn btn-primary" style="font-size:0.85rem;">📥 Fetch Locks</button>
        </div>
      </div>
    </div>

    <div id="status-bar" class="hidden" style="margin-bottom:20px;"></div>

    <div class="stats-grid" id="la-stats"></div>
    <div id="la-list"></div>

  </main>

  <footer class="app-footer">
    <p>Locked Assessments · <span class="version">v2.5.0</span></p>
  </footer>

  <script src="../config.js?v=2.4.2-ef72ab8"></script>
  <script src="../assets/js/app.js?v=2.4.2-ef72ab8"></script>
  <script src="../assets/js/store.js?v=2.4.2-ef72ab8"></script>
  <script src="../assets/js/security.js?v=2.4.2-ef72ab8"></script>
  <script src="../assets/js/ui-helpers.js?v=2.4.2-ef72ab8"></script>
  <script src="../assets/js/sync.js?v=2.4.2-ef72ab8"></script>
  <script src="../assets/js/teacher-auth.js?v=2.4.2-ef72ab8"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tokenInput = document.getElementById('teacher-token');
      const searchInput = document.getElementById('la-search');
      const fetchBtn = document.getElementById('btn-fetch');
      const statusBar = document.getElementById('status-bar');
      
      let allLocks = []; // Holds locks fetched from backend

      searchInput.addEventListener('input', renderFilteredList);
      fetchBtn.addEventListener('click', fetchAndRenderLocks);

      // Don't auto-fetch on load. Wait for user to enter token and click.
      renderList(); 

      async function fetchAndRenderLocks() {
        const token = tokenInput.value.trim();
        if (!token) return showStatus('warning', 'Please enter the teacher token.');
        
        fetchBtn.disabled = true;
        fetchBtn.textContent = '⏳ Fetching...';
        showStatus('info', 'Fetching locks from backend...');

        try {
          const res = await Sync.pullLocks(); // No filter, get all locks
          if (!res.ok) {
            showStatus('danger', '❌ Backend error: ' + (res.error || 'Unknown'));
            allLocks = [];
          } else {
            allLocks = res.records || [];
            showStatus('success', `✅ Loaded ${allLocks.length} locks from backend.`);
          }
        } catch (err) {
          showStatus('danger', '❌ Fetch failed: ' + err.message);
          allLocks = [];
        } finally {
          fetchBtn.disabled = false;
          fetchBtn.textContent = '📥 Fetch Locks';
          renderStats();
          renderFilteredList();
        }
      }

      function renderFilteredList() {
        const query = searchInput.value.toLowerCase().trim();
        let filtered = allLocks;
        if (query) {
          filtered = allLocks.filter((l) =>
            (l.studentName || '').toLowerCase().includes(query) ||
            (l.lrn || '').includes(query)
          );
        }
        renderList(filtered);
      }

      function renderStats() {
        const passing = allLocks.filter((l) => (l.total > 0 ? (l.score / l.total) * 100 : 0) >= 80).length;
        const below80 = allLocks.length - passing;
        document.getElementById('hero-meta').innerHTML = `
          <div class="teacher-hero-stat">🔒 <strong>${allLocks.length}</strong> Total Locked</div>
          <div class="teacher-hero-stat">✅ <strong>${passing}</strong> Passing</div>
          <div class="teacher-hero-stat">⚠️ <strong>${below80}</strong> Below 80%</div>
        `;
        document.getElementById('la-stats').innerHTML = `
          <div class="stat-card red"><div class="stat-icon">🔒</div><div class="stat-value">${allLocks.length}</div><div class="stat-label">Total Locked</div></div>
          <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-value">${passing}</div><div class="stat-label">Passing (≥ 80%)</div></div>
          <div class="stat-card amber"><div class="stat-icon">⚠️</div><div class="stat-value">${below80}</div><div class="stat-label">Below 80%</div></div>
        `;
      }

      function renderList(locks = []) {
        const list = document.getElementById('la-list');
        if (!locks.length) {
          list.innerHTML = `<div style="background:#fff;border-radius:14px;padding:48px 24px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.04);"><div style="font-size:3.5rem;">🎉</div><h3 style="margin:12px 0 6px;color:#2e7d32;">All Clear!</h3><p style="color:#5f6368;font-size:0.95rem;margin:0;">No locked assessments found in the backend.</p></div>`;
          return;
        }

        list.innerHTML = locks.map((l) => {
          const percent = l.total > 0 ? Math.round((l.score / l.total) * 100) : 0;
          const color = percent >= 80 ? '#0277bd' : percent >= 65 ? '#ed6c02' : '#c62828';
          const status = percent >= 80 ? '<span class="badge-pill success" style="font-size:0.68rem;">✓ PASSING</span>' : '<span class="badge-pill warning" style="font-size:0.68rem;">⚠ BELOW 80%</span>';
          const assessmentLabel = formatAssessmentId(l.assessmentId);
          const subjectEmoji = l.assessmentId.startsWith('biol1') ? '🔬' : '🌱';

          return `
            <div style="background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.05);border-left:4px solid ${color};margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
              <div style="flex:1;min-width:220px;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
                  <span style="font-weight:700;font-size:0.95rem;color:#1a1a1a;">${l.studentName}</span>
                  ${status}
                </div>
                <div style="font-size:0.78rem;color:#78909c;margin-bottom:8px;">LRN: ${APP.formatLRN(l.lrn)} · ${l.section || '—'}</div>
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:0.88rem;">
                  <span style="font-weight:600;color:#37474f;">${subjectEmoji} ${assessmentLabel}</span>
                  <span style="color:${color};font-weight:800;font-size:1rem;">${l.score}/${l.total}</span>
                  <span style="color:${color};font-weight:700;">(${percent}%)</span>
                </div>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-primary" style="font-size:0.82rem;padding:9px 16px;font-weight:600;" onclick="pushUnlock('${l.lrn}', '${l.assessmentId}')">☁️ Push Unlock</button>
              </div>
            </div>`;
        }).join('');
      }
      
      function formatAssessmentId(id) {
        const map = { 'biol1-quiz1': 'Bio 1 · Quiz 1', /* ... etc ... */ };
        return map[id] || id;
      }

      window.pushUnlock = async function (lrn, assessmentId) {
        const token = tokenInput.value.trim();
        if (!token) { APP.toast('Enter teacher token.', 'warning'); return; }
        if (!Sync.backendEnabled()) { APP.toast('Backend not configured.', 'danger'); return; }
        if (!confirm(`Push unlock for ${assessmentId} to ${lrn}?`)) return;

        try {
          const res = await Sync.pushUnlock(lrn, assessmentId, token, 'teacher-approved');
          if (res.ok) {
            APP.toast(`☁️ Unlock pushed for ${lrn}`, 'success');
            // Also delete the corresponding lock from the backend
            await Sync.deleteLock(`${lrn}-${assessmentId}`);
            // Refresh the list to show it's gone
            fetchAndRenderLocks();
          } else {
            APP.toast('❌ Push failed: ' + (res.error || 'Unknown'), 'danger');
          }
        } catch (err) {
          APP.toast('❌ ' + err.message, 'danger');
        }
      };

      function showStatus(type, message) {
        statusBar.classList.remove('hidden');
        const colors = { success: '#e8f5e9', warning: '#fff3e0', danger: '#ffebee', info: '#e1f5fe' };
        const borders = { success: '#2e7d32', warning: '#ed6c02', danger: '#c62828', info: '#0277bd' };
        statusBar.style.cssText = `padding:14px 18px;background:${colors[type]};border-left:4px solid ${borders[type]};border-radius:10px;font-size:0.9rem;font-weight:500;`;
        statusBar.textContent = message;
      }
    });
  </script>
</body>
</html>
