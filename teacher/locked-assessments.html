<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locked Assessments — Teacher</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/teacher.css" />
</head>
<body>

  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div>
        <h1>🔒 Locked Assessments</h1>
        <span class="version">v2.4.3</span>
      </div>
      <nav class="teacher-nav">
        <a href="../instructor.html">← Teacher Home</a>
        <button onclick="TeacherAuth.logout()">🚪 Log Out</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;">

    <div class="teacher-hero" style="background:linear-gradient(135deg, #7f0000 0%, #b71c1c 50%, #e53935 100%);">
      <div class="teacher-hero-content">
        <div class="teacher-hero-text">
          <h1>🔒 Manage Locked Assessments</h1>
          <p>Push unlocks to students who failed due to internet issues or other technical problems.</p>
          <div class="teacher-hero-meta" id="hero-meta"></div>
        </div>
        <div class="teacher-hero-actions">
          <a href="#" onclick="autoRepairLocks(); return false;">🔧 Auto-Repair Locks</a>
          <a href="#" onclick="unlockAll(); return false;">🔓 Unlock All (Local)</a>
        </div>
      </div>
    </div>

    <div class="card" style="padding:20px;margin-bottom:24px;">
      <label class="form-label" style="font-size:0.75rem;text-transform:uppercase;font-weight:700;color:#5f6368;">Teacher Token</label>
      <input type="password" id="teacher-token" class="form-control" placeholder="Enter teacher password (for push)" style="max-width:320px;" />

      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin-top:16px;">
        <div style="flex:1;min-width:200px;">
          <label class="form-label" style="font-size:0.75rem;text-transform:uppercase;font-weight:700;color:#5f6368;">Subject</label>
          <select id="la-subject" class="form-control">
            <option value="">All Subjects</option>
            <option value="biol1">General Biology 1</option>
            <option value="biol2">General Biology 2</option>
          </select>
        </div>
        <div style="flex:1;min-width:200px;">
          <label class="form-label" style="font-size:0.75rem;text-transform:uppercase;font-weight:700;color:#5f6368;">Search Student</label>
          <input type="text" id="la-search" class="form-control" placeholder="Type a name or LRN..." />
        </div>
        <div>
          <button id="btn-clear" class="btn btn-outline" style="font-size:0.85rem;">↺ Clear</button>
        </div>
      </div>
    </div>

    <!-- Diagnostic Panel -->
    <div id="diag-panel" class="hidden" style="margin-bottom:24px;"></div>

    <div class="stats-grid" id="la-stats"></div>
    <div id="la-list"></div>

  </main>

  <footer class="app-footer">
    <p>Locked Assessments · <span class="version">v2.4.3</span></p>
  </footer>

  <script src="../config.js?v=2.4.2-dd8e2e6"></script>
  <script src="../assets/js/app.js?v=2.4.2-dd8e2e6"></script>
  <script src="../assets/js/store.js?v=2.4.2-dd8e2e6"></script>
  <script src="../assets/js/security.js?v=2.4.2-dd8e2e6"></script>
  <script src="../assets/js/ui-helpers.js?v=2.4.2-dd8e2e6"></script>
  <script src="../assets/js/sync.js?v=2.4.2-dd8e2e6"></script>
  <script src="../assets/js/teacher-auth.js?v=2.4.2-dd8e2e6"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const subjectSel = document.getElementById('la-subject');
      const searchInput = document.getElementById('la-search');
      const btnClear = document.getElementById('btn-clear');
      const tokenInput = document.getElementById('teacher-token');
      const diagPanel = document.getElementById('diag-panel');

      subjectSel.addEventListener('change', render);
      searchInput.addEventListener('input', render);
      btnClear.addEventListener('click', () => {
        subjectSel.value = '';
        searchInput.value = '';
        render();
      });

      // Run diagnostic on load to detect mismatches
      runMismatchDiagnostic();

      render();

      function collectLocks() {
        const users = APP.sortStudents(Store.getAllUsers(), 'last', 'asc');
        const locks = [];
        users.forEach((u) => {
          const prefix = `gba_v1_lock_${u.lrn}_`;
          Object.keys(localStorage).forEach((key) => {
            if (key.startsWith(prefix)) {
              try {
                const data = JSON.parse(localStorage.getItem(key));
                const assessmentId = key.replace(prefix, '');
                const subject = assessmentId.startsWith('biol1') ? 'biol1' : 'biol2';
                locks.push({ user: u, subject, assessmentId, locked: data, key });
              } catch (e) { /* ignore */ }
            }
          });
        });
        return locks;
      }

      /**
       * Scan all users' scores and find any that don't have a lock.
       * Shows a diagnostic panel if mismatches are found.
       */
      function runMismatchDiagnostic() {
        const users = Store.getAllUsers();
        const mismatches = [];

        users.forEach((u) => {
          const scores = Store.getScores(u.lrn);
          ['biol1', 'biol2'].forEach((subj) => {
            ['quizzes', 'st', 'te'].forEach((type) => {
              const bucket = scores[subj]?.[type] || {};
              Object.keys(bucket).forEach((aid) => {
                const fullId = aid.startsWith(subj + '-') ? aid : subj + '-' + aid;
                const lockKey = `gba_v1_lock_${u.lrn}_${fullId}`;
                if (!localStorage.getItem(lockKey)) {
                  mismatches.push({
                    user: u,
                    subject: subj,
                    type,
                    assessmentId: fullId,
                    score: bucket[aid].score,
                    total: bucket[aid].total,
                    percent: bucket[aid].percent,
                    timestamp: bucket[aid].timestamp
                  });
                }
              });
            });
          });
        });

        if (!mismatches.length) {
          diagPanel.classList.add('hidden');
          return;
        }

        diagPanel.classList.remove('hidden');
        diagPanel.innerHTML = `
          <div style="background:#fff3e0;border-left:4px solid #ed6c02;border-radius:10px;padding:16px 18px;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
              <div>
                <div style="font-weight:700;color:#e65100;font-size:1rem;margin-bottom:4px;">
                  ⚠️ ${mismatches.length} score(s) without lock detected
                </div>
                <div style="font-size:0.85rem;color:#5f6368;">
                  These scores are saved but have no corresponding lock. This usually happens when a student's device has an older version of the app. Click "Auto-Repair" to fix.
                </div>
              </div>
              <button onclick="autoRepairLocks()" class="btn btn-primary" style="font-size:0.9rem;padding:10px 18px;font-weight:600;">
                🔧 Auto-Repair Locks
              </button>
            </div>
            <details style="margin-top:12px;">
              <summary style="cursor:pointer;font-size:0.85rem;color:#5f6368;font-weight:600;">
                Show ${mismatches.length} mismatch(es)
              </summary>
              <ul style="margin-top:8px;padding-left:20px;font-size:0.83rem;color:#37474f;">
                ${mismatches.slice(0, 20).map((m) => `
                  <li style="margin-bottom:4px;">
                    ${m.user.lastName}, ${m.user.firstName} · ${m.assessmentId} · 
                    <strong>${m.score}/${m.total}</strong> (${m.percent}%)
                  </li>
                `).join('')}
                ${mismatches.length > 20 ? `<li style="color:#90a4ae;">…and ${mismatches.length - 20} more</li>` : ''}
              </ul>
            </details>
          </div>
        `;
      }

      function render() {
        let locks = collectLocks();
        const subject = subjectSel.value;
        if (subject) locks = locks.filter((l) => l.subject === subject);

        const query = searchInput.value.toLowerCase().trim();
        if (query) {
          locks = locks.filter((l) =>
            `${l.user.lastName} ${l.user.firstName} ${l.user.lrn}`.toLowerCase().includes(query)
          );
        }

        renderHeroMeta(locks);
        renderStats(locks);
        renderList(locks);
      }

      function renderHeroMeta(locks) {
        const el = document.getElementById('hero-meta');
        if (!el) return;
        const passing = locks.filter((l) => l.locked.percent >= 80).length;
        const below80 = locks.length - passing;
        el.innerHTML = `
          <div class="teacher-hero-stat">🔒 <strong>${locks.length}</strong> Total Locked</div>
          <div class="teacher-hero-stat">✅ <strong>${passing}</strong> Passing</div>
          <div class="teacher-hero-stat">⚠️ <strong>${below80}</strong> Below 80%</div>
        `;
      }

      function renderStats(locks) {
        const biol1Count = locks.filter((l) => l.subject === 'biol1').length;
        const biol2Count = locks.filter((l) => l.subject === 'biol2').length;
        const passing = locks.filter((l) => l.locked.percent >= 80).length;
        const below80 = locks.length - passing;

        document.getElementById('la-stats').innerHTML = `
          <div class="stat-card red"><div class="stat-icon">🔒</div><div class="stat-value">${locks.length}</div><div class="stat-label">Total Locked</div></div>
          <div class="stat-card blue"><div class="stat-icon">🔬</div><div class="stat-value">${biol1Count}</div><div class="stat-label">Bio 1 Locked</div></div>
          <div class="stat-card purple"><div class="stat-icon">🌱</div><div class="stat-value">${biol2Count}</div><div class="stat-label">Bio 2 Locked</div></div>
          <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-value">${passing}</div><div class="stat-label">Passing (≥ 80%)</div></div>
          <div class="stat-card amber"><div class="stat-icon">⚠️</div><div class="stat-value">${below80}</div><div class="stat-label">Below 80%</div></div>
        `;
      }

      function renderList(locks) {
        const list = document.getElementById('la-list');
        if (!locks.length) {
          list.innerHTML = `
            <div style="background:#fff;border-radius:14px;padding:48px 24px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.04);">
              <div style="font-size:3.5rem;">🎉</div>
              <h3 style="margin:12px 0 6px;color:#2e7d32;">All Clear!</h3>
              <p style="color:#5f6368;font-size:0.95rem;margin:0;">No locked assessments match your filters.</p>
            </div>
          `;
          return;
        }

        list.innerHTML = locks.map((l) => {
          const avatar = UI.renderAvatar(l.user.firstName, l.user.lastName, l.user.lrn);
          const percent = l.locked.percent || 0;
          const color = percent >= 90 ? '#2e7d32' : percent >= 80 ? '#0277bd' : percent >= 65 ? '#ed6c02' : '#c62828';
          const status = percent >= 80
            ? '<span class="badge-pill success" style="font-size:0.68rem;">✓ PASSING</span>'
            : '<span class="badge-pill warning" style="font-size:0.68rem;">⚠ BELOW 80%</span>';
          const assessmentLabel = formatAssessmentId(l.assessmentId);
          const subjectEmoji = l.subject === 'biol1' ? '🔬' : '🌱';

          return `
            <div style="background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.05);border-left:4px solid ${color};margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
              ${avatar}
              <div style="flex:1;min-width:220px;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
                  <span style="font-weight:700;font-size:0.95rem;color:#1a1a1a;">${APP.formatFullName(l.user.lastName, l.user.firstName, l.user.middleName)}</span>
                  ${APP.getSexBadge(l.user.sex)} ${status}
                </div>
                <div style="font-size:0.78rem;color:#78909c;margin-bottom:8px;">
                  LRN: ${APP.formatLRN(l.user.lrn)} · ${l.user.section}
                </div>
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:0.88rem;">
                  <span style="font-weight:600;color:#37474f;">${subjectEmoji} ${assessmentLabel}</span>
                  <span style="color:${color};font-weight:800;font-size:1rem;">${l.locked.score}/${l.locked.total}</span>
                  <span style="color:${color};font-weight:700;">(${percent}%)</span>
                  ${l.locked.lockedAt ? `<span style="color:#b0bec5;font-size:0.75rem;">· ${UI.fmtDateRelative(l.locked.lockedAt)}</span>` : ''}
                </div>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-primary" style="font-size:0.82rem;padding:9px 16px;font-weight:600;" onclick="pushUnlock('${l.user.lrn}', '${l.assessmentId}')">
                  ☁️ Push Unlock
                </button>
                <button class="btn btn-outline" style="font-size:0.82rem;padding:9px 14px;" onclick="unlockLocalOnly('${l.user.lrn}', '${l.assessmentId}')">
                  🔓 Local Only
                </button>
                <button class="btn btn-outline" style="font-size:0.82rem;padding:9px 14px;" onclick="viewDetails('${l.user.lrn}', '${l.assessmentId}')">
                  👁️ Details
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      function formatAssessmentId(id) {
        const map = {
          'biol1-quiz1': 'Bio 1 · Quiz 1', 'biol1-quiz2': 'Bio 1 · Quiz 2', 'biol1-quiz3': 'Bio 1 · Quiz 3',
          'biol1-st1': 'Bio 1 · ST 1', 'biol1-st2': 'Bio 1 · ST 2', 'biol1-te': 'Bio 1 · TE',
          'biol2-quiz1': 'Bio 2 · Quiz 1', 'biol2-quiz2': 'Bio 2 · Quiz 2', 'biol2-quiz3': 'Bio 2 · Quiz 3',
          'biol2-st1': 'Bio 2 · ST 1', 'biol2-st2': 'Bio 2 · ST 2', 'biol2-te': 'Bio 2 · TE'
        };
        return map[id] || id;
      }

      /* ---------- Push Unlock (backend) ---------- */
      window.pushUnlock = async function (lrn, assessmentId) {
        const token = tokenInput.value.trim();
        if (!token) {
          APP.toast('Enter the teacher token (password) first.', 'warning');
          tokenInput.focus();
          return;
        }
        if (!Sync.backendEnabled()) {
          APP.toast('Backend not configured — using local unlock.', 'warning');
          return window.unlockLocalOnly(lrn, assessmentId);
        }

        const user = Store.getUser(lrn);
        const name = user ? APP.formatFullName(user.lastName, user.firstName, user.middleName) : lrn;
        const label = formatAssessmentId(assessmentId);

        if (!confirm(`Push unlock for "${label}" to ${name}?\n\nThe student will receive the unlock on their next page load.`)) return;

        try {
          const res = await Sync.pushUnlock(lrn, assessmentId, token, 'teacher-approved');
          if (res.ok) {
            APP.toast('☁️ Unlock pushed to backend' + (res.duplicate ? ' (already pending)' : ''), 'success', 4000);
            Store.unlockAssessment(lrn, assessmentId);
            render();
          } else {
            APP.toast('❌ Push failed: ' + (res.error || 'Unknown error'), 'danger', 5000);
          }
        } catch (err) {
          APP.toast('❌ ' + err.message, 'danger');
        }
      };

      /* ---------- Local unlock only ---------- */
      window.unlockLocalOnly = function (lrn, assessmentId) {
        const user = Store.getUser(lrn);
        const name = user ? APP.formatFullName(user.lastName, user.firstName, user.middleName) : lrn;
        const label = formatAssessmentId(assessmentId);

        if (!confirm(`Unlock "${label}" for ${name} on THIS device only?\n\nThe student will still be locked on their own device.`)) return;

        Store.unlockAssessment(lrn, assessmentId);
        APP.toast('🔓 Unlocked locally only', 'info');
        render();
      };

      /* ---------- Unlock all (local) ---------- */
      window.unlockAll = function () {
        const locks = collectLocks();
        if (!locks.length) { APP.toast('No locked assessments to unlock.', 'info'); return; }
        if (!confirm(`Unlock ALL ${locks.length} assessments locally on this device?`)) return;
        locks.forEach((l) => Store.unlockAssessment(l.user.lrn, l.assessmentId));
        APP.toast(`🔓 ${locks.length} assessments unlocked locally`, 'success');
        render();
      };

      /* ---------- Auto-repair missing locks ---------- */
      window.autoRepairLocks = function () {
        const users = Store.getAllUsers();
        let fixed = 0;
        const details = [];

        users.forEach((u) => {
          const scores = Store.getScores(u.lrn);
          ['biol1', 'biol2'].forEach((subj) => {
            ['quizzes', 'st', 'te'].forEach((type) => {
              const bucket = scores[subj]?.[type] || {};
              Object.keys(bucket).forEach((aid) => {
                const fullId = aid.startsWith(subj + '-') ? aid : subj + '-' + aid;
                const lockKey = `gba_v1_lock_${u.lrn}_${fullId}`;
                if (!localStorage.getItem(lockKey)) {
                  const data = bucket[aid];
                  localStorage.setItem(lockKey, JSON.stringify({
                    locked: true,
                    score: data.score,
                    total: data.total,
                    percent: data.percent,
                    lockedAt: data.timestamp || new Date().toISOString(),
                    repairedAt: new Date().toISOString(),
                    repairedFrom: 'auto-repair'
                  }));
                  fixed++;
                  details.push(`${u.lastName}, ${u.firstName} · ${fullId} · ${data.score}/${data.total}`);
                }
              });
            });
          });
        });

        if (fixed === 0) {
          APP.toast('✅ No missing locks found. Everything is in sync.', 'success', 4000);
        } else {
          APP.toast(`🔧 Repaired ${fixed} missing lock(s). Reloading...`, 'success', 5000);
          console.log('Repaired locks:');
          details.forEach((d) => console.log('  ' + d));
          setTimeout(() => location.reload(), 1500);
        }
      };

      /* ---------- View details ---------- */
      window.viewDetails = function (lrn, assessmentId) {
        const key = `gba_v1_lock_${lrn}_${assessmentId}`;
        const data = JSON.parse(localStorage.getItem(key) || '{}');
        const user = Store.getUser(lrn);
        const name = user ? APP.formatFullName(user.lastName, user.firstName, user.middleName) : lrn;
        alert(
          `Assessment Details\n\n` +
          `Student: ${name}\n` +
          `LRN: ${APP.formatLRN(lrn)}\n` +
          `Assessment: ${formatAssessmentId(assessmentId)}\n` +
          `Score: ${data.score}/${data.total} (${data.percent}%)\n` +
          `Locked at: ${data.lockedAt ? APP.formatDate(data.lockedAt) : 'Unknown'}` +
          (data.repairedFrom ? `\n\n⚠️ This lock was auto-repaired from a missing lock.` : '')
        );
      };
    });
  </script>
</body>
</html>
