<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remediation Module</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/student.css" />
</head>
<body>

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1>📚 Remediation Module</h1>
        <span class="version">v1.0.0</span>
      </div>
      <a href="../dashboard.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Dashboard</a>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:900px;">

    <div class="card">
      <h2 style="color:var(--color-warning);">🎯 Targeted Review</h2>
      <p class="text-muted" id="rem-intro">Loading your remediation plan...</p>
    </div>

    <div id="rem-content"></div>

  </main>

  <footer class="app-footer">
    <p>Remediation · v1.0.0</p>
  </footer>

  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/store.js"></script>
  <script src="../../assets/js/transmutation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = Store.getCurrentUser();
      if (!user) { window.location.href = '../login.html'; return; }

      const params = new URLSearchParams(window.location.search);
      const subject = params.get('subject') || 'biol1';
      const stId = params.get('st') || 'biol1-st1';

      const scores = Store.getScores(user.lrn);
      const stData = scores[subject]?.st?.[stId];

      if (!stData) {
        document.getElementById('rem-intro').textContent = 'No assessment data found for this remediation.';
        return;
      }

      const missed = (stData.breakdown || []).filter((b) => !b.isCorrect);
      const missedComps = [...new Set(missed.map((m) => m.competency))];

      document.getElementById('rem-intro').textContent =
        `You scored ${stData.percent}% on ${stId.toUpperCase()}. Focus on the following competencies to improve.`;

      const compTitles = {
        // Add mapping as needed
      };

      const content = document.getElementById('rem-content');
      if (missedComps.length === 0) {
        content.innerHTML = `<div class="alert alert-success">🎉 No missed competencies found. Great work!</div>`;
        return;
      }

      content.innerHTML = `
        <div class="card">
          <h3>📋 Competencies to Review</h3>
          <ul style="margin-top:12px;">
            ${missedComps.map((c) => `
              <li style="padding:8px 0;">
                <span class="badge badge-warning">${c}</span>
                <span style="margin-left:8px;">${compTitles[c] || 'Review lesson content for this competency.'}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      `;

      // Suggest a retake
      content.innerHTML += `
        <div class="card">
          <h3>✅ Next Steps</h3>
          <ol style="margin-left:20px;margin-top:12px;">
            <li>Revisit the lesson days for the competencies above.</li>
            <li>Complete the practice activities again.</li>
            <li>Retake the assessment only after teacher approval (assessments are locked after submission).</li>
          </ol>
          <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
            <a href="../${subject}/index.html" class="btn btn-primary">📖 Review Lessons</a>
            <button id="btn-complete-rem" class="btn btn-accent">✅ Mark Remediation Complete</button>
          </div>
        </div>
      `;

      document.getElementById('btn-complete-rem').addEventListener('click', () => {
        const user2 = Store.getUser(user.lrn) || {};
        user2.remediationCompleted = true;
        user2.remediationCompletedAt = new Date().toISOString();
        user2.remediationUnlocked = false;
        Store.saveUser(user2);
        APP.toast('Remediation marked complete!', 'success');
        setTimeout(() => (window.location.href = '../dashboard.html'), 800);
      });
    });
  </script>
</body>
</html>
