<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remediation Module</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/student.css" />
</head>
<body>

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1>📚 Remediation Module</h1>
        <span class="version">v2.6.0</span>
      </div>
      <a href="../dashboard.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Dashboard</a>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:900px;">

    <div class="card">
      <h2 style="color:var(--color-warning);">🎯 Targeted Review</h2>
      <p class="text-muted" id="rem-intro">Loading your remediation plan...</p>
    </div>

    <div id="rem-content"></div>

  </main>

  <footer class="app-footer">
    <p>Remediation · v2.6.0</p>
  </footer>

  <script src="../../config.js?v=2.4.2-4b8c4cb"></script>
  <script src="../../assets/js/app.js?v=2.4.2-4b8c4cb"></script>
  <script src="../../assets/js/store.js?v=2.4.2-4b8c4cb"></script>
  <script src="../../assets/js/transmutation.js?v=2.4.2-4b8c4cb"></script>
  <script src="../../assets/js/security.js?v=2.4.2-4b8c4cb"></script>
  <script src="../../assets/js/sync.js?v=2.4.2-4b8c4cb"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = Store.getCurrentUser();
      if (!user) { window.location.href = '../login.html'; return; }

      const params = new URLSearchParams(window.location.search);
      const subject = params.get('subject') || 'biol1';
      const stId = params.get('st') || 'biol1-st1';

      const scores = Store.getScores(user.lrn);
      const stData = scores[subject]?.st?.[stId];

      if (!stData) {
        document.getElementById('rem-intro').textContent = 'No assessment data found for this remediation.';
        return;
      }

      const missed = (stData.breakdown || []).filter((b) => !b.isCorrect);
      const missedComps = [...new Set(missed.map((m) => m.competency))];

      document.getElementById('rem-intro').textContent = `You scored ${stData.percent}% on ${stId.toUpperCase()}. Focus on the following competencies to improve.`;

      // Competency statements + the week that teaches each one
      const esc = (v) => String(v === null || v === undefined ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const compInfo = {};
      try {
        const cr = await fetch(`../../data/${subject}-competencies.json?v=` + encodeURIComponent(CONFIG.VERSION));
        const cj = await cr.json();
        (cj.contentAreas || []).forEach((ca) => (ca.competencies || []).forEach((c) => { compInfo[c.code] = { desc: c.desc, week: String(c.week || '').split(/[^0-9]+/)[0], area: ca.title }; }));
      } catch (e) { /* show codes only */ }
      const items = (stData.breakdown || []);
      const perComp = {};
      items.forEach((b) => {
        const k = b.competency || 'General';
        perComp[k] = perComp[k] || { total: 0, wrong: 0 };
        perComp[k].total++;
        if (!b.isCorrect) perComp[k].wrong++;
      });

      const content = document.getElementById('rem-content');
      if (missedComps.length === 0) {
        content.innerHTML = `<div class="alert alert-success">🎉 No missed competencies found. Great work!</div>`;
        return;
      }
      const ordered = missedComps.slice().sort((x, y) => (perComp[y]?.wrong / perComp[y]?.total || 0) - (perComp[x]?.wrong / perComp[x]?.total || 0));

      content.innerHTML = `
        <div class="card">
          <h3>📋 Competencies to Review</h3>
          <p class="text-small text-muted">Most-missed first. Open the week, re-read the daily discussions, and redo the activities.</p>
          <ul style="margin-top:12px;line-height:1.6;">
            ${ordered.map((code) => {
              const info = compInfo[code] || {};
              const pc = perComp[code] || { total: 0, wrong: 0 };
              const link = info.week ? `../${subject}/week${info.week}/index.html` : `../${subject}/index.html`;
              return `<li style="margin-bottom:10px;">
                <strong>${esc(code)}</strong> — ${esc(info.desc || 'See the lesson for this competency')}
                <br><span class="text-small text-muted">Missed ${pc.wrong} of ${pc.total} item(s)${info.week ? ' · Week ' + esc(info.week) : ''}</span>
                · <a href="${link}">Review →</a></li>`;
            }).join('')}
          </ul>
        </div>
        <div class="card">
          <h3>✅ Next Steps</h3>
          <ol style="line-height:1.7;">
            <li>Review each competency above — start with the one you missed most.</li>
            <li>Redo the day activities for those weeks ("Practice Again" keeps your passing score).</li>
            <li>When you are ready, request a retake code for ${esc(stId.toUpperCase())} from the Assessments page.</li>
          </ol>
          <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
            <a href="../${subject}/index.html" class="btn btn-primary">📖 Review Lessons</a>
            <a href="../assessments/index.html?subject=${subject}" class="btn btn-outline">📝 Assessments</a>
            <button id="btn-complete-rem" class="btn btn-accent">✅ Mark Remediation Complete</button>
          </div>
        </div>
      `;

      document.getElementById('btn-complete-rem').addEventListener('click', async () => {
        const btn = document.getElementById('btn-complete-rem');
        btn.disabled = true;
        btn.textContent = '⏳ Saving...';


        // 3. Update user record in localStorage
        const updated = Store.getUser(user.lrn) || { ...user };
        updated.remediationCompleted = true;
        updated.remediationCompletedAt = new Date().toISOString();
        updated.remediationUnlocked = false;
        Store.saveUser(updated);
        
        APP.toast('Remediation marked complete! You can now request a retake code.', 'success');
        setTimeout(() => (window.location.href = '../dashboard.html'), 1500);
      });
    });
  </script>
</body>
</html>
