<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remediation Module</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/student.css" />
</head>
<body>

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1>📚 Remediation Module</h1>
        <span class="version">v2.4.0</span>
      </div>
      <a href="../dashboard.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Dashboard</a>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:900px;">

    <div class="card">
      <h2 style="color:var(--color-warning);">🎯 Targeted Review</h2>
      <p class="text-muted" id="rem-intro">Loading your remediation plan...</p>
    </div>

    <div id="rem-content"></div>

  </main>

  <footer class="app-footer">
    <p>Remediation · v2.4.0</p>
  </footer>

  <script src="../../config.js?v=2.4.2-72bdf0d"></script>
  <script src="../../assets/js/app.js?v=2.4.2-72bdf0d"></script>
  <script src="../../assets/js/store.js?v=2.4.2-72bdf0d"></script>
  <script src="../../assets/js/transmutation.js?v=2.4.2-72bdf0d"></script>
  <script src="../../assets/js/security.js?v=2.4.2-72bdf0d"></script>
  <script src="../../assets/js/sync.js?v=2.4.2-72bdf0d"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = Store.getCurrentUser();
      if (!user) { window.location.href = '../login.html'; return; }

      const params = new URLSearchParams(window.location.search);
      const subject = params.get('subject') || 'biol1';
      const stId = params.get('st') || 'biol1-st1';

      const scores = Store.getScores(user.lrn);
      const stData = scores[subject]?.st?.[stId];

      if (!stData) {
        document.getElementById('rem-intro').textContent = 'No assessment data found for this remediation.';
        return;
      }

      const missed = (stData.breakdown || []).filter((b) => !b.isCorrect);
      const missedComps = [...new Set(missed.map((m) => m.competency))];

      document.getElementById('rem-intro').textContent = `You scored ${stData.percent}% on ${stId.toUpperCase()}. Focus on the following competencies to improve.`;

      // ... [compTitles loading and render unchanged] ...

      const content = document.getElementById('rem-content');
      if (missedComps.length === 0) {
        content.innerHTML = `<div class="alert alert-success">🎉 No missed competencies found. Great work!</div>`;
        return;
      }

      content.innerHTML = `
        <div class="card">
          <h3>📋 Competencies to Review</h3>
          <ul> ... </ul>
        </div>
        <div class="card">
          <h3>✅ Next Steps</h3>
          <ol> ... </ol>
          <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
            <a href="../${subject}/index.html" class="btn btn-primary">📖 Review Lessons</a>
            <button id="btn-complete-rem" class="btn btn-accent">✅ Mark Remediation Complete</button>
          </div>
        </div>
      `;

      document.getElementById('btn-complete-rem').addEventListener('click', async () => {
        const btn = document.getElementById('btn-complete-rem');
        btn.disabled = true;
        btn.textContent = '⏳ Clearing...';

        // 1. Clear the retake-unlock flag locally
        if (window.Sync && typeof Sync.clearRetakeUnlock === 'function') {
          Sync.clearRetakeUnlock(user.lrn, stId);
        }

        // 2. Delete the lock from the backend
        if (window.Sync && typeof Sync.deleteLock === 'function') {
          const lockId = `${user.lrn}-${stId}`;
          await Sync.deleteLock(lockId); // This is a best-effort call
        }

        // 3. Update user record in localStorage
        const updated = Store.getUser(user.lrn) || { ...user };
        updated.remediationCompleted = true;
        updated.remediationCompletedAt = new Date().toISOString();
        updated.remediationUnlocked = false;
        Store.saveUser(updated);
        
        APP.toast('Remediation marked complete! You can now retake the assessment.', 'success');
        setTimeout(() => (window.location.href = '../dashboard.html'), 1500);
      });
    });
  </script>
</body>
</html>
