<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login — General Biology</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/student.css" />
</head>
<body>

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1>🧬 Student Login</h1>
        <span class="version">v1.0.0</span>
      </div>
      <a href="../index.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Back</a>
    </div>
  </header>

  <main class="container" style="max-width:560px;padding-top:32px;padding-bottom:64px;">

    <!-- Tabs: Login / Register / Saved users -->
    <div class="sync-tabs" style="justify-content:center;">
      <button class="sync-tab active" data-tab="login">Log In</button>
      <button class="sync-tab" data-tab="register">New Student</button>
      <button class="sync-tab" data-tab="saved">Saved Users</button>
    </div>

    <!-- LOGIN TAB -->
    <div id="tab-login" class="card">
      <div class="card-header">
        <span class="card-title">🔑 Enter your LRN</span>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-lrn">LRN (12 digits)</label>
          <input type="text" id="login-lrn" class="form-control" inputmode="numeric"
                 maxlength="14" placeholder="1234-5678-9012" autocomplete="off" required />
          <div class="form-hint">Your Learner Reference Number</div>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Log In →</button>
        <div id="login-error" class="alert alert-danger hidden" style="margin-top:16px;"></div>
      </form>
    </div>

    <!-- REGISTER TAB -->
    <div id="tab-register" class="card hidden">
      <div class="card-header">
        <span class="card-title">📝 Create Your Profile</span>
      </div>
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-lastname">Last Name *</label>
          <input type="text" id="reg-lastname" class="form-control" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-firstname">First Name *</label>
          <input type="text" id="reg-firstname" class="form-control" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-middlename">Middle Name</label>
          <input type="text" id="reg-middlename" class="form-control" autocomplete="off" />
          <div class="form-hint">Optional</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-lrn">LRN (12 digits) *</label>
          <input type="text" id="reg-lrn" class="form-control" inputmode="numeric"
                 maxlength="14" placeholder="1234-5678-9012" required autocomplete="off" />
          <div class="form-hint">Exactly 12 digits, numeric only</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-grade">Grade Level *</label>
          <select id="reg-grade" class="form-control" required>
            <option value="">— Select —</option>
            <option value="12" selected>Grade 12</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-section">Section *</label>
          <select id="reg-section" class="form-control" required>
            <option value="">— Select —</option>
            <option value="GAS" selected>GAS</option>
            <option value="STEM">STEM</option>
            <option value="ABM">ABM</option>
            <option value="HUMSS">HUMSS</option>
          </select>
        </div>

        <label class="flex gap-sm" style="align-items:flex-start;font-size:0.9rem;margin:16px 0;">
          <input type="checkbox" id="reg-consent" required style="margin-top:4px;" />
          <span>I agree that my progress may be saved locally on this device and shared with my teacher via sync code or backup file.</span>
        </label>

        <button type="submit" class="btn btn-primary btn-full">Create Profile →</button>
        <div id="register-error" class="alert alert-danger hidden" style="margin-top:16px;"></div>
      </form>
    </div>

    <!-- SAVED USERS TAB -->
    <div id="tab-saved" class="card hidden">
      <div class="card-header">
        <span class="card-title">👥 Saved Users on This Device</span>
      </div>
      <div id="saved-users-list"></div>
    </div>

  </main>

  <footer class="app-footer">
    <p>General Biology Online Modular Application · v1.0.0</p>
  </footer>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/backup.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
