<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summative Test 2</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/student.css" />
  <link rel="stylesheet" href="../../assets/css/quiz.css" />
</head>
<body class="quiz-active">

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1>📝 Summative Test 2</h1>
        <span class="version">v2.3.7</span>
      </div>
      <a href="index.html" id="back-link" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Assessments</a>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:820px;">

    <div id="quiz-header"></div>
    <div id="quiz-body"></div>
    <div id="quiz-nav" style="margin-top:24px;"></div>

  </main>

  <footer class="app-footer">
    <p>Summative Test 2 · v2.3.7</p>
  </footer>

  <script src="../../config.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/store.js"></script>
  <script src="../../assets/js/security.js"></script>
  <script src="../../assets/js/transmutation.js"></script>
  <script src="../../assets/js/quiz-engine.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const subject = params.get('subject') || 'biol1';

      const backLink = document.getElementById('back-link');
      if (backLink) backLink.href = `index.html?subject=${subject}`;

      const file = subject === 'biol2' ? '../../data/biol2-st2.json' : '../../data/biol1-st2.json';

      const res = await fetch(file);
      const data = await res.json();

      QuizEngine.init({
        assessmentId: data.assessmentId,
        subject: data.subject,
        type: data.type,
        title: data.title,
        items: data.items,
        timeLimit: data.timeLimit,
        passingScore: data.passingScore
      });
    });
  </script>
</body>
</html>
