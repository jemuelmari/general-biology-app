<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance Task 1</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/student.css" />
</head>
<body>

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1>🎨 Performance Task 1</h1>
        <span class="version">v1.0.0</span>
      </div>
      <a href="../dashboard.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Dashboard</a>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:820px;">

    <div id="pt-header"></div>
    <div id="pt-body"></div>

  </main>

  <footer class="app-footer">
    <p>Performance Task 1 · v1.0.0</p>
  </footer>

  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/store.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = Store.getCurrentUser();
      if (!user) { window.location.href = '../login.html'; return; }

      const params = new URLSearchParams(window.location.search);
      const subject = params.get('subject') || 'biol1';

      const res = await fetch('../../data/performance-tasks.json');
      const data = await res.json();
      const subjectData = data[subject];
      const task = subjectData.tasks[0]; // PT1

      // Check if already submitted
      const scores = Store.getScores(user.lrn);
      const existing = scores[subject]?.pt?.[task.id];

      const header = document.getElementById('pt-header');
      const body = document.getElementById('pt-body');

      header.innerHTML = `
        <div class="card">
          <h2 style="color:var(--color-primary-dark);">${task.title}</h2>
          <p class="text-muted">Coverage: ${task.coverage} · Max Score: ${task.maxScore}</p>
        </div>
      `;

      if (existing) {
        body.innerHTML = `
          <div class="card">
            <div class="alert alert-success">
              <strong>✅ Submitted</strong>
              <p style="margin-top:8px;">You chose: <strong>Option ${existing.option}</strong></p>
              <p class="text-small text-muted">Submitted on ${APP.formatDate(existing.timestamp)}</p>
            </div>
            <p class="text-muted">Your teacher will grade this Performance Task and enter your score in the class record.</p>
          </div>
        `;
        return;
      }

      body.innerHTML = `
        <div class="card">
          <h3>📋 Choose Your Performance Task</h3>
          <p class="text-muted">Select ONE option below. Your teacher will grade it based on the rubric.</p>
          <div id="pt-options" style="margin-top:16px;"></div>
          <button id="pt-submit" class="btn btn-primary btn-full" style="margin-top:20px;" disabled>Submit Selection</button>
        </div>
      `;

      const optionsEl = document.getElementById('pt-options');
      let selected = null;

      task.options.forEach((opt) => {
        const label = document.createElement('label');
        label.style.cssText = `
          display:flex;align-items:flex-start;gap:12px;
          padding:14px 16px;margin-bottom:10px;
          background:var(--color-surface);
          border:2px solid var(--color-border);
          border-radius:8px;cursor:pointer;transition:all 0.15s;
        `;
        label.innerHTML = `
          <input type="radio" name="pt" value="${opt.key}" style="margin-top:3px;" />
          <span style="flex:1;font-size:0.95rem;">
            <strong style="color:var(--color-primary-dark);">Option ${opt.key}.</strong>
            ${opt.label}
          </span>
        `;

        label.addEventListener('click', () => {
          document.querySelectorAll('#pt-options label').forEach((l) => {
            l.style.borderColor = 'var(--color-border)';
            l.style.background = 'var(--color-surface)';
          });
          label.style.borderColor = 'var(--color-primary)';
          label.style.background = 'var(--color-primary-light)';
          selected = opt.key;
          document.getElementById('pt-submit').disabled = false;
        });

        optionsEl.appendChild(label);
      });

      document.getElementById('pt-submit').addEventListener('click', () => {
        if (!selected) return;
        const opt = task.options.find((o) => o.key === selected);

        Store.saveScore(user.lrn, subject, 'pt', task.id, {
          option: selected,
          optionLabel: opt.label,
          status: 'submitted',
          score: null,
          maxScore: task.maxScore
        });

        APP.toast('Performance Task submitted!', 'success');
        setTimeout(() => window.location.reload(), 900);
      });
    });
  </script>
</body>
</html>
