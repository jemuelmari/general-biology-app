<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 8 — Lesson</title>
  <link rel="stylesheet" href="../../../assets/css/main.css" />
  <link rel="stylesheet" href="../../../assets/css/student.css" />
</head>
<body>

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1>🔬 Week 8 · Lesson</h1>
        <span class="version">v2.6.0</span>
      </div>
      <a href="index.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Back</a>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;">
    <div class="daily-score-bar" id="daily-score-bar"></div>
    <div id="lesson-content"></div>
    <div class="activity-card"><div id="activity-1"></div></div>
    <div class="activity-card"><div id="activity-2"></div></div>
    <div class="activity-card"><div id="formative"></div></div>
    <div class="card" id="lesson-footer"></div>
  </main>

  <footer class="app-footer"><p>General Biology 1 · Week 8 · v2.6.0</p></footer>

  <script src="../../../config.js?v=2.4.2-4b8c4cb"></script>
  <script src="../../../assets/js/app.js?v=2.4.2-4b8c4cb"></script>
  <script src="../../../assets/js/store.js?v=2.4.2-4b8c4cb"></script>
  <script src="../../../assets/js/sync.js?v=2.4.2-4b8c4cb"></script>
  <script src="../../../assets/js/sync-master.js?v=2.4.2-4b8c4cb"></script>
  <script src="../../../assets/js/bundle.js?v=2.4.2-4b8c4cb"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const SUBJECT = 'biol1', WEEK = 8;
      const params = new URLSearchParams(window.location.search);
      const dayNum = parseInt(params.get('day') || '1', 10);
      const user = Store.getCurrentUser();
      if (!user) { window.location.href = '../../login.html'; return; }

      // Days open in order: previous day (or previous week's Day 4) must be complete
      const prevKey = dayNum > 1 ? `${SUBJECT}-w${WEEK}-d${dayNum - 1}` : (WEEK > 1 ? `${SUBJECT}-w${WEEK - 1}-d4` : null);
      const isDone = () => ((Store.getProgress(user.lrn)[SUBJECT] || {}).completed || []).includes(prevKey);
      if (prevKey && !isDone() && navigator.onLine && window.SyncMaster) {
        // maybe it was finished on another device: pull once (max 5 s)
        await Promise.race([SyncMaster.pullFromBackend(user.lrn).catch(() => null), new Promise((r) => setTimeout(r, 5000))]);
      }
      if (prevKey && !isDone()) {
        document.getElementById('lesson-content').innerHTML =
          '<div class="card text-center"><div style="font-size:2.5rem;">🔒</div><h2>Locked</h2><p class="text-muted">Finish the previous day first (pass its Formative).</p><a class="btn btn-primary" href="index.html">← Back to Week ' + WEEK + '</a></div>';
        return;
      }

      const res = await fetch('week8.json?v=' + encodeURIComponent(CONFIG.VERSION));
      const week = await res.json();
      const day = week.days.find((d) => Number(d.n) === dayNum);

      if (!day) {
        document.getElementById('lesson-content').innerHTML = '<div class="alert alert-danger">Lesson not found.</div>';
        return;
      }

      document.title = `Day ${day.n} — ${day.title}`;
      document.body.dataset.next = dayNum < 4 ? `day.html?day=${dayNum + 1}` : 'index.html';

      document.getElementById('lesson-content').innerHTML = `
        <div class="card lesson-content">
          <h2>📖 ${day.title}</h2>
          <p class="text-muted text-small">Competency: ${day.competency}</p>
          ${day.content}
        </div>`;

      document.getElementById('lesson-footer').innerHTML = `
        <h3>📌 Key Takeaways</h3>
        <ul>${(day.takeaways || []).map((t) => `<li>${t}</li>`).join('')}</ul>
        <h3>📚 References</h3>
        <ul class="text-small text-muted">
          <li>Urry, L. A. et al. (2020). <em>Campbell Biology</em> (12th ed.). Pearson.</li>
          <li>DepEd K to 12 Senior High School STEM Specialized Subject Curriculum Guide — General Biology 1.</li>
        </ul>`;

      window.Lesson.init({ subject: SUBJECT, week: WEEK, day: day.n, title: day.title, maxPoints: 300 });
      window.Lesson.renderMatchGame('activity-1', day.activity1);
      window.Lesson.renderScenarioGame('activity-2', day.activity2);
      window.Lesson.renderEscapeRoom('formative', day.formative);
    });
  </script>
</body>
</html>
