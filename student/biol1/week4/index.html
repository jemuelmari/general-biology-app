  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = Store.getCurrentUser();
      if (!user) { window.location.href = '../../login.html'; return; }

        { n: 2, title: 'Passive Transport & Osmosis', comp: 'Ig-h-12, -13' },
        { n: 3, title: 'Active Transport', comp: 'Ig-h-13' },
        { n: 4, title: 'Endocytosis & Exocytosis', comp: 'Ig-h-14' }
      ];

      const progress = Store.getProgress(user.lrn);
      const done = progress.biol1?.completed || [];

      document.getElementById('days-grid').innerHTML = days.map((d) => {
        const key = `biol1-w4-d${d.n}`;
        const completed = done.includes(key);
        const prevDone = d.n === 1 || done.includes(`biol1-w4-d${d.n - 1}`);
        const locked = !prevDone;

        return `
          <div class="subject-card" data-day="${d.n}" style="${locked ? 'opacity:0.5;' : ''}">
            <div style="display:flex;justify-content:space-between;align-items:center;">

              ${completed ? '<span class="badge badge-success">✅ Done</span>' : locked ? '<span class="badge" style="background:#eee;color:#999;">🔒 Locked</span>' : '<span class="badge badge-warning">▶ Start</span>'}
            </div>
